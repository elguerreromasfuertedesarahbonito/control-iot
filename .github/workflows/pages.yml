name: Verificar y publicar frontend en Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obtener fuentes
        uses: actions/checkout@v6
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Ejecutar pruebas simuladas
        run: node --test tests/*.test.js
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Preparar solo el frontend publico
        shell: bash
        run: |
          mkdir -p _site/assets
          cp index.html .nojekyll _site/
          cp -R assets/. _site/assets/
      - name: Subir artefacto estatico
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

